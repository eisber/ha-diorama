name: Fork feature checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check public data before building
        run: |
          git fetch --no-tags https://github.com/CarlesRojas/ha-diorama.git main
          python3 scripts/check-public-data.py --base FETCH_HEAD
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
